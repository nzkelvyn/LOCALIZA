<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPC TI LOCALIZA | Infraestrutura de TI</title>
  <style>
    :root {
      --navy: #0e1b3d;
      --navy-2: #142351;
      --bg: #eef1f6;
      --card: #ffffff;
      --border: #e3e7ef;
      --text: #1b2333;
      --muted: #7b8497;
      --blue: #2e6bf2;
      --blue-soft: #e8effe;
      --green: #12b76a;
      --green-soft: #e6f9ef;
      --amber: #f79009;
      --amber-soft: #fff6e5;
      --red: #f04438;
      --red-soft: #fdeceb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
      color: #cfd6ea;
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 6px 26px 6px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .brand-name {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #e9ecf7;
    }

    .brand-toggle {
      margin-left: auto;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cfd6ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    nav.nav-primary {
      margin-top: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 9px;
      color: #aeb7d1;
      font-size: 14px;
      cursor: default;
      margin-bottom: 2px;
    }

    .nav-item .ic {
      width: 18px;
      text-align: center;
      opacity: 0.9;
    }

    .nav-group-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      color: #c4cbe4;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-group-label .chev {
      margin-left: auto;
      font-size: 11px;
      opacity: .7;
    }

    .nav-sub {
      padding-left: 34px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
    }

    .nav-sub-item {
      padding: 9px 10px;
      font-size: 13.5px;
      border-radius: 8px;
      color: #8f9ac2;
      position: relative;
    }

    .nav-sub-item.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 600;
    }

    .nav-sub-item.active::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5b8bff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 10px 4px;
      font-size: 11px;
      color: #6b7594;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ---------- MAIN ---------- */
    .main {
      flex: 1;
      min-width: 0;
      padding: 28px 34px 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 26px;
      gap: 20px;
    }

    .topbar h1 {
      margin: 0 0 4px;
      font-size: 26px;
      font-weight: 800;
      color: #111a30;
    }

    .topbar p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      color: #2a3550;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    /* stat cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 2px rgba(20, 30, 60, 0.03);
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .stat-icon.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .stat-icon.green {
      background: var(--green-soft);
      color: var(--green);
    }

    .stat-icon.amber {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .stat-icon.red {
      background: var(--red-soft);
      color: var(--red);
    }

    .stat-label {
      font-size: 12px;
      letter-spacing: 0.4px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 800;
      color: #111a30;
    }

    /* alerts panel */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(20, 30, 60, 0.03);
    }

    .panel-head h2 {
      margin: 0 0 2px;
      font-size: 16px;
      font-weight: 800;
      color: #111a30;
    }

    .panel-head p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .alerts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
      margin-top: 18px;
    }

    .alert-col-title {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #3a4560;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .alert-empty {
      font-size: 13px;
      color: #b7bdcb;
    }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--red-soft);
      border: 1px solid #fbd6d2;
      color: #b3261e;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 9px;
    }

    /* table */
    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .table-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--muted);
      min-width: 250px;
    }

    .search-box svg {
      flex-shrink: 0;
      opacity: .6;
    }

    .badge-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    thead th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11.5px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: #293049;
    }

    tbody tr:hover {
      background: #f7f9fc;
    }

    .cell-host {
      font-weight: 700;
      color: #152047;
    }

    .cell-muted {
      color: #b6bcc9;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-pill.estoque {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .status-pill.uso {
      background: var(--green-soft);
      color: var(--green);
    }

    .status-pill.manutencao {
      background: var(--amber-soft);
      color: #b5680a;
    }

    .link-edit {
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 22px 0 4px;
    }

    .page-num {
      font-size: 14px;
      color: #b6bcc9;
      font-weight: 600;
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      user-select: none;
    }

    .page-num:hover {
      color: #2a3550;
    }

    .page-num.active {
      color: #1b2333;
      border-bottom-color: #1b2333;
    }

    .page-arrow {
      color: #b6bcc9;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      user-select: none;
    }

    .page-arrow.disabled {
      color: #e3e7ef;
      cursor: default;
    }

    .page-arrow:hover:not(.disabled) {
      color: #2a3550;
    }

    @media (max-width: 1100px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .alerts-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .main {
        padding: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 12px;
      }
    }
  </style>
</head>

    const ROWS_PER_PAGE = 12;

    const tbody = document.getElementById("table-body");
    const searchInput = document.getElementById("search-input");
    const resultCount = document.getElementById("result-count");
    const paginationEl = document.getElementById("pagination");

    let listaAtual = rows;
    let paginaAtual = 1;

    function normalizar(s) {
      return (s || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function renderTabela() {
      const totalPaginas = Math.max(1, Math.ceil(listaAtual.length / ROWS_PER_PAGE));
      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;

      const inicio = (paginaAtual - 1) * ROWS_PER_PAGE;
      const pagina = listaAtual.slice(inicio, inicio + ROWS_PER_PAGE);

      tbody.innerHTML = "";
      pagina.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td class="cell-host">${r.usuario}</td>
        <td class="${r.gerente === '-' ? 'cell-muted' : ''}">${r.gerente}</td>
        <td class="${r.andar === '-' ? 'cell-muted' : ''}">${r.andar}</td>
        <td class="${r.localizacao === '-' ? 'cell-muted' : ''}">${r.localizacao}</td>
      `;
        tbody.appendChild(tr);
      });

      resultCount.textContent = listaAtual.length + (listaAtual.length === 1 ? " resultado" : " resultados");
      renderPaginacao(totalPaginas);
    }

    function irParaPagina(p) {
      paginaAtual = p;
      renderTabela();
    }

    function renderPaginacao(totalPaginas) {
      paginationEl.innerHTML = "";
      if (totalPaginas <= 1) return;

      const prev = document.createElement("span");
      prev.className = "page-arrow" + (paginaAtual === 1 ? " disabled" : "");
      prev.innerHTML = "&#8249;";
      prev.onclick = () => { if (paginaAtual > 1) irParaPagina(paginaAtual - 1); };
      paginationEl.appendChild(prev);

      const janela = 3;
      let inicio = Math.max(1, paginaAtual - 1);
      let fim = Math.min(totalPaginas, inicio + janela - 1);
      inicio = Math.max(1, fim - janela + 1);

      for (let p = inicio; p <= fim; p++) {
        const span = document.createElement("span");
        span.className = "page-num" + (p === paginaAtual ? " active" : "");
        span.textContent = p;
        span.onclick = () => irParaPagina(p);
        paginationEl.appendChild(span);
      }

      const next = document.createElement("span");
      next.className = "page-arrow" + (paginaAtual === totalPaginas ? " disabled" : "");
      next.innerHTML = "&#8250;";
      next.onclick = () => { if (paginaAtual < totalPaginas) irParaPagina(paginaAtual + 1); };
      paginationEl.appendChild(next);
    }

    function filtrar() {
      const termo = normalizar(searchInput.value.trim());
      listaAtual = !termo ? rows : rows.filter(r =>
        normalizar(r.usuario).includes(termo) ||
        normalizar(r.gerente).includes(termo) ||
        normalizar(r.setor).includes(termo)
      );
      paginaAtual = 1;
      renderTabela();
    }

    searchInput.addEventListener("input", filtrar);

    renderTabela();
  </script>
